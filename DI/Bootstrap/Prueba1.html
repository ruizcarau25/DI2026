<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="p-3">

<div id="tabla-contenedor">
  <table class="table">
    <thead>
      <tr>
        <th scope="col">#<button class="btn btn-sm btn-outline-danger ms-1 eliminar-col">×</button></th>
        <th scope="col">First<button class="btn btn-sm btn-outline-danger ms-1 eliminar-col">×</button></th>
        <th scope="col">Last<button class="btn btn-sm btn-outline-danger ms-1 eliminar-col">×</button></th>
        <th scope="col">Handle<button class="btn btn-sm btn-outline-danger ms-1 eliminar-col">×</button></th>
        <th class="acciones"></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">1</th><td>Mark</td><td>Otto</td><td>@mdo</td>
        <td class="acciones"><button class="btn btn-secondary eliminar-fila">Eliminar</button></td>
      </tr>
      <tr>
        <th scope="row">2</th><td>Jacob</td><td>Thornton</td><td>@fat</td>
        <td class="acciones"><button class="btn btn-secondary eliminar-fila">Eliminar</button></td>
      </tr>
      <tr>
        <th scope="row">3</th><td>John</td><td>Doe</td><td>@social</td>
        <td class="acciones"><button class="btn btn-secondary eliminar-fila">Eliminar</button></td>
      </tr>
    </tbody>
  </table>

  <button id="añadir-fila" class="btn btn-primary">Añadir fila</button>
  <button id="añadir-col" class="btn btn-primary">Añadir columna</button>
  <button id="eliminar-tabla" class="btn btn-danger">Eliminar tabla</button>
</div>

<script src="script.js"></script>

</body>
</html>
